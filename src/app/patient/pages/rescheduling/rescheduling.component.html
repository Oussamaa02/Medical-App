<div class="min-h-screen bg-gradient-to-br from-blue-50 to-white">
    <div class="max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
      <!-- Calendar Container -->
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="flex flex-col lg:flex-row">
          <!-- Calendar Section -->
          <div class="lg:w-2/3">
            <app-calendar
              [doctorId]="doctorId"
              (confirmEvent)="handleConfirm($event)"
              (dateSelected)="onDateSelected($event)"
              (timeSelected)="onTimeSelected($event)"
            ></app-calendar>
          </div>
  
          <!-- Booking Summary Sidebar -->
          <div class="lg:w-1/3 bg-gray-50 p-6 border-t lg:border-t-0 lg:border-l border-gray-200 relative">
            <!-- Make the container relative for absolute positioning -->
            <div class="h-full flex flex-col">
              <!-- Scrollable content area -->
              <div class="flex-grow overflow-y-auto pb-20"> <!-- Added pb-20 for button space -->
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Appointment Summary</h2>
                
                <div class="space-y-4">
                  <!-- Your existing summary content -->
                  <div>
                    <h3 class="text-sm font-medium text-gray-500 mb-1">Doctor</h3>
                    <p class="text-gray-800">Dr. {{ doctorName }}</p>
                  </div>
          
                  <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-sm font-medium text-gray-500 mb-1">Selected Date</h3>
                    <p class="text-gray-800" [ngClass]="{'text-blue-600 font-medium': selectedDate}">
                      {{ (selectedDate | date:'fullDate') || 'Not selected' }}
                    </p>
                  </div>
          
                  <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-sm font-medium text-gray-500 mb-1">Selected Time</h3>
                    <p class="text-gray-800" [ngClass]="{'text-blue-600 font-medium': selectedTime}">
                      {{ selectedTime ? (selectedTime.substring(0, 5)) : 'Not selected' }}
                    </p>
                  </div>
          
                  <div class="pt-4 border-t border-gray-200" *ngIf="selectedDate && selectedTime">
                    <div class="flex items-center text-green-600">
                      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                      </svg>
                      <span class="text-sm">Ready to book</span>
                    </div>
                  </div>
                </div>
              </div>
          
              <!-- Fixed button at the bottom -->
              <div class="absolute bottom-0 left-0 right-0 p-6 bg-gray-50 border-t border-gray-200">
                <button 
                  [disabled]="!selectedDate || !selectedTime"
                  (click)="handleConfirm({date: selectedDate!, time: selectedTime!})"
                  class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed"
                >
                  Confirm Booking
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
