<div class="min-h-screen bg-gradient-to-br from-blue-50 to-white py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
      <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <!-- Profile Header -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-500 px-6 py-8 text-center sm:text-left">
          <div class="flex flex-col sm:flex-row items-center gap-6">
            <div class="relative">
              <div class="h-24 w-24 rounded-full bg-white/20 backdrop-blur-sm border-2 border-white/30 flex items-center justify-center text-white text-3xl font-bold">
                {{ getInitials(doctor?.firstName || '') }}{{ getInitials(doctor?.lastName || '') }}
              </div>

            </div>
            <div class="text-white">
              <h1 class="text-2xl font-bold">{{ doctor?.firstName }} {{ doctor?.lastName }}</h1>
              <p class="text-blue-100">{{ doctor?.email }}</p>
            </div>
          </div>
        </div>
  
        <!-- Profile Form -->
        <form [formGroup]="profileForm" class="px-6 py-8 space-y-6">
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <!-- First Name -->
            <div>
              <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
              <input type="text" id="firstName" formControlName="firstName" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
  
            <!-- Last Name -->
            <div>
              <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
              <input type="text" id="lastName" formControlName="lastName" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
  
            <!-- Email -->
            <!-- <div class="sm:col-span-2">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input type="email" id="email" formControlName="email" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div> -->

            <!-- Password -->
            <div class="sm:col-span-2">
              <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input type="password" id="password" formControlName="password" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
  
            <!-- Phone -->
            <div>
              <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
              <input type="tel" id="phone" formControlName="phoneNumber" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
  
            <!-- License Number -->
             
            <div>
              <label for="licenseNumber" class="block text-sm font-medium text-gray-700 mb-1">License Number</label>
              <input type="text" id="licenseNumber" formControlName="licenseNumber" 
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <!-- Speciality -->
            <div>
              <label for="speciality" class="block text-sm font-medium text-gray-700 mb-1">Speciality</label>
              <select 
        class="p-2 border text-black rounded-md border-gray-300 w-full"
        formControlName="speciality"
      >
        <option value="" disabled >Select Specialization</option>
        <option value="Dentist">Dentist</option>
        <option value="Orthodontist">Orthodontist</option>
        <option value="Radiologist">Radiologist</option>
        <option value="Psychiatrist">Psychiatrist</option>
        <option value="Physiatrist">Physiatrist</option>
        <option value="Pediatrician">Pediatrician</option>
        <option value="Gynecologist">Gynecologist</option>
        <option value="Neurologist">Neurologist</option>
        <option value="Dermatologist">Dermatologist</option>
        <option value="Cardiologist">Cardiologist</option>
        <option value="General Practitioner">General Practitioner</option>
        <option value="Plastic Surgeon">Plastic Surgeon</option>
        <option value="General Surgeon">General Surgeon</option>
      </select>
            </div>

            <!-- Address -->
            <div>
              <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
              <input type="text" id="address" formControlName="address" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <!-- City -->
            <div>
              <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
              <select 
      class="p-2 border text-black rounded-md border-gray-300 w-full"
      formControlName="city"
      >
      <option value="" disabled >Select City</option>
      <option value="Tunis">Tunis</option>
      <option value="Sfax">Sfax</option>
      <option value="Sousse">Sousse</option>
      <option value="Kairouan">Kairouan</option>
      <option value="Bizerte">Bizerte</option>
      <option value="Gabès">Gabès</option>
      <option value="Ariana">L'Ariana</option>
      <option value="Gafsa">Gafsa</option>
      <option value="Nabeul">Nabeul</option>
      <option value="Ben Arous">Ben Arous</option>
      <option value="Monastir">Monastir</option>
      <option value="Médenine">Médenine</option>
      <option value="Kébili">Kébili</option>
      <option value="Tataouine">Tataouine</option>
      <option value="Tozeur">Tozeur</option>
      <option value="Béja">Béja</option>
      <option value="Jendouba">Jendouba</option>
      <option value="Kasserine">Kasserine</option>
      <option value="Le Kef">Le Kef</option>
      <option value="Mahdia">Mahdia</option>
      <option value="Manouba">La Manouba</option>
      <option value="Sidi Bouzid">Sidi Bouzid</option>
      <option value="Siliana">Siliana</option>
      <option value="Zaghouan">Zaghouan</option>
      </select>
            </div>

            <!-- Zip Code -->
            <div>
              <label for="zipCode" class="block text-sm font-medium text-gray-700 mb-1">Zip Code</label>
              <input type="text" id="zipCode" formControlName="zipCode" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
          </div>
  
          <!-- Action Buttons -->
          <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
            <button type="button" (click)="cancelEdit()" 
                    class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-800 transition">
              Cancel
            </button>
            <button type="submit" [disabled]="!profileForm.valid || !profileForm.dirty" 
            (click)="onSubmit()"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition disabled:bg-gray-300 disabled:cursor-not-allowed">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
