<div class="max-w-4xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-6 text-blue-600">My Appointments</h1>
  
    <div *ngIf="(appointments$ | async)?.length === 0" class="text-gray-500">
      No appointments found.
    </div>
  
    <div class="space-y-6">
      <div 
        *ngFor="let appt of appointments$ | async" 
        class="bg-white p-4 rounded shadow"
      >
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center">
          <div>
            <p class="text-lg font-medium">
              {{ appt.date }} at {{ appt.time }}
            </p>
            <p class="text-sm text-gray-500">{{ appt.doctor }}</p>
          </div>
          
          <div class="mt-2 sm:mt-0 flex gap-2 items-center">
            <span [class]="'text-sm px-3 py-1 rounded-full ' + getStatusClass(appt.status)">
              {{ appt.status }}
            </span>
            
            <ng-container *ngIf="appt.status === 'CONFIRMED'">
              <button
                (click)="handleCancel(appt.id)"
                class="text-sm px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition"
              >
                Cancel
              </button>
              <button
                (click)="setReschedulingId(appt.id)"
                class="text-sm px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
              >
                Reschedule
              </button>
            </ng-container>
          </div>
        </div>
  
        <!-- Render Calendar under the rescheduled appointment -->
        <div *ngIf="reschedulingId === appt.id" class="mt-4">
          <app-calendar
            (confirmEvent)="handleRescheduleConfirm($event)"
            (cancelEvent)="cancelReschedule()"
          ></app-calendar>
        </div>
      </div>
    </div>
  </div>
