<div class="w-full max-w-md mx-auto mt-4 bg-white p-4 rounded-lg shadow">
    <div class="w-20 h-20 mx-auto bg-blue-100 rounded-full flex items-center justify-center mb-4">
      <i-lucide name="brain" class="w-10 h-10 text-blue-600"></i-lucide>
    </div>
    
    <p class="text-lg font-semibold mb-5 text-center">
      Would you like to take a smart pre-visit assessment?
    </p>
    
    <p class="text-sm text-gray-600 mb-6 text-center">
      Our AI assistant will ask you a few personalized questions to help prepare for your visit and make the most of your time.
    </p>
    
    <div class="flex items-center justify-center space-x-3 text-sm text-blue-600">
      <i-lucide name="clock" class="w-4 h-4"></i-lucide>
      <span>Takes 2-3 minutes • Completely confidential</span>
    </div>
  
    <div class="mt-10 text-center flex justify-center gap-3">
      <button  
        (click)="onStart()"
        class="px-4 py-2 rounded text-white text-sm transition bg-blue-600 hover:bg-blue-700"
      >
        Start
      </button>
  
      <button
        (click)="onCancel()"
        class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200"
      >
        Cancel
      </button>
    </div>
  </div>
