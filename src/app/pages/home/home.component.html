<div  class="min-h-[calc(100vh-4rem)] bg-gradient-to-br from-blue-50 to-white flex items-center">
  <div class="container mx-auto px-4 py-8">
    <div class="flex flex-col-reverse lg:flex-row items-center justify-between gap-8 lg:gap-12">
      
      <!-- Left: Text Content -->
      <div class="w-full lg:w-1/2">
        <h1 class="text-3xl sm:text-4xl font-bold leading-tight text-gray-900 mb-4">
          Simplify Your Medical <span class="text-blue-600">Appointment Booking</span>
        </h1>
        <p class="text-gray-600 mb-6 leading-relaxed">
          Schedule medical appointments effortlessly with instant confirmations.
        </p>
        <div class="flex flex-col sm:flex-row gap-3">
          <a 
            routerLink="/about" 
            class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow transition-colors duration-300"
          >
            Learn More
          </a>
          
        </div>
      </div>
  
      <!-- Right: Calendar -->
      <div class="w-full lg:w-1/2 mb-6 lg:mb-0">
        <div class="bg-white p-4 sm:p-6 rounded-xl shadow-md border border-gray-100">
          <app-calendar 
            (confirmEvent)="handleConfirm($event)"
            (cancelEvent)="handleCancel()"
          ></app-calendar>
        </div>
      </div>
    </div>
  </div>
</div>
