<div class="min-h-screen bg-gradient-to-br from-blue-50 to-white  p-6 md:p-10">
  <div class="max-w-7xl mx-auto">
    <!-- Header Section -->
    <header class="mb-10">
      <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-2">Welcome back, <span>{{getDoctorName()}}</span>!</h1>
      <p class="text-lg text-gray-600">Here's what's happening today</p>
    </header>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2  gap-6 mb-10 ">
      <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500 hover:shadow-md transition-all duration-300">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500">Today's Appointments</p>
            <p class="text-2xl font-semibold text-gray-800">{{ getTodayAppointments().length }}</p>
          </div>
        </div>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-gray-400 hover:shadow-md transition-all duration-300">
        <div class="flex items-center">
          <div class="p-3 rounded-full bg-gray-100 text-gray-600 mr-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium text-gray-500">Available Slots</p>
            <p class="text-2xl font-semibold text-gray-800">{{timeSlots.length}}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2  gap-6">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 group">
        <div class="p-6">
          <div class="flex items-center mb-4">
            <div class="p-3 rounded-lg bg-blue-50 text-blue-600 mr-4 group-hover:bg-blue-100 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-800">Appointments</h2>
          </div>
          <p class="text-gray-600 mb-6">View and manage your upcoming patient appointments</p>
          <button (click)="navigateTo('appointments')" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center">
            View Appointments
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 group">
        <div class="p-6">
          <div class="flex items-center mb-4">
            <div class="p-3 rounded-lg bg-gray-50 text-gray-600 mr-4 group-hover:bg-gray-100 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-800">Time Slots</h2>
          </div>
          <p class="text-gray-600 mb-6">Configure your available consultation hours</p>
          <button (click)="navigateTo('time-slots')" class="w-full bg-gray-500 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center">
            Manage Time Slots
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
